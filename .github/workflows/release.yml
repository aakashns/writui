# Builds writui for each platform when a version tag (e.g. v0.1.0) is pushed,
# and publishes the binaries as a GitHub release. scripts/ship.sh pushes the
# tag. Pull requests that touch this file run the builds without publishing.
#
# Binary names carry no version, so the latest one is always at
# https://github.com/aakashns/writui/releases/latest/download/<name>
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, target: aarch64-apple-darwin, os: macos-latest }
          - { name: macos-x86_64, target: x86_64-apple-darwin, os: macos-latest }
          # 22.04 rather than latest, so the binaries run on older glibc too.
          - { name: linux-x86_64, target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { name: linux-arm64, target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { name: windows-x86_64, target: x86_64-pc-windows-msvc, os: windows-latest, exe: .exe }
          - { name: windows-arm64, target: aarch64-pc-windows-msvc, os: windows-11-arm, exe: .exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/writui${{ matrix.exe }}" "dist/writui-${{ matrix.name }}${{ matrix.exe }}"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum writui-* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "writui ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
