{% extends "base.html" %}
{% block content %}
<article>
  <header class="post">
    <h1>{{ page.title }}</h1>
    {% if page.date %}<time datetime="{{ page.date }}">{{ page.date | date(format="%b %-d, %Y") }}</time>{% endif %}
    {% if page.updated and page.updated != page.date %}<time class="updated" datetime="{{ page.updated }}">· updated {{ page.updated | date(format="%b %-d, %Y") }}</time>{% endif %}
  </header>
  {{ page.content | safe }}
</article>
{% endblock %}
