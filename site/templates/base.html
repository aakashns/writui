<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  <link rel="preload" href="{{ get_url(path='fonts/InterVariable.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="{{ get_url(path='favicon.svg') }}" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="writui blog" href="{{ get_url(path='blog/atom.xml') }}">
</head>
<body>
  <header class="site">
    <a class="name" href="{{ get_url(path='/') }}">writui</a>
    <nav>
      <a href="{{ get_url(path='blog/') }}">Blog</a>
      <a href="{{ get_url(path='changelog/') }}">Changelog</a>
      <a href="{{ config.extra.repo }}">GitHub</a>
    </nav>
  </header>
  <main>
{% block content %}{% endblock %}
  </main>
  <footer class="site">
    <a href="{{ config.extra.repo }}">Source</a> · MIT licensed ·
    <a href="{{ get_url(path='blog/atom.xml') }}">Feed</a>
  </footer>
</body>
</html>
