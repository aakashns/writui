[package]
name = "writui"
version = "0.10.0"
edition = "2024"
description = "A terminal writing app. Markdown, encrypted, no nonsense."
license = "MIT"
repository = "https://github.com/aakashns/writui"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
argon2 = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
jiff = "0.2.37"
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.10.3"
ratatui = "0.30.2"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml = "1.1.6"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"

# Dependencies (notably Argon2) are painfully slow unoptimised; optimise them
# even in dev builds so unlocking doesn't take ages.
[profile.dev.package."*"]
opt-level = 3
